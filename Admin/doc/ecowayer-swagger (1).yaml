# ============================================================
# COMPONENTS
# ============================================================
components:
  # --------------------------------------------------------
  # SECURITY SCHEMES
  # --------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token do usuário autenticado. Rotas marcadas com escopo "admin" exigem token de administrador
        (tbl_administrador).
  # --------------------------------------------------------
  # RESPONSES REUTILIZÁVEIS
  # --------------------------------------------------------
  responses:
    BadRequest400:
      description: ERROR_BAD_REQUEST — os dados enviados na requisição não estão corretos (falha de validação
        do Request Body).
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: false
              status_code:
                type: integer
                example: 400
              message:
                type: string
                example: Os Dados enviados na requisição não estão corretos!
          example:
            status: false
            status_code: 400
            message: Os Dados enviados na requisição não estão corretos!
    UnsupportedMediaType415:
      description: 'ERROR_CONTENT_TYPE — a API só aceita requisições com Content-Type: application/json
        (exceto o upload em /imagens, que usa multipart/form-data).'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: false
              status_code:
                type: integer
                example: 415
              message:
                type: string
                example: NÃO FOI POSSIVEL PROCESSAR A REQUISIÇÃO, pois o formato de dados aceito pela
                  API é somente JSON!
          example:
            status: false
            status_code: 415
            message: NÃO FOI POSSIVEL PROCESSAR A REQUISIÇÃO, pois o formato de dados aceito pela API
              é somente JSON!
    NotFound404:
      description: ERROR_NOT_FOUND — não foi encontrado nenhum dado para retorno.
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: false
              status_code:
                type: integer
                example: 404
              message:
                type: string
                example: NÃO FOI ENCONTRADO NENHUM DADO PARA RETORNO!
          example:
            status: false
            status_code: 404
            message: NÃO FOI ENCONTRADO NENHUM DADO PARA RETORNO!
    InternalServerError500:
      description: 'Erro interno: ERROR_INTERNAL_SEVER_MODEL (falha na camada de modelagem/banco) ou ERROR_INTERNAL_CONTROLER
        (falha na camada de controller).'
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: boolean
                example: false
              status_code:
                type: integer
                example: 500
              message:
                type: string
                example: Mensagem varia conforme a camada onde o erro ocorreu
          examples:
            erro_model:
              summary: Falha na modelagem de dados (Model)
              value:
                status: false
                status_code: 500
                message: NÃO FOI POSSIVEL PROCESSAR A REQUISIÇÃO POR CONTA DE ERRO NA API [ERRO NA MODELAGEM
                  DE DADOS]!
            erro_controller:
              summary: Falha na Controller
              value:
                status: false
                status_code: 500
                message: NÃO FOI POSSIVEL PROCESSAR A REQUISIÇÃO POR CONTA DE ERRO NA API [ERRO NA CONTROLER]!
  # --------------------------------------------------------
  # SCHEMAS
  # --------------------------------------------------------
  schemas:
    RespostaBase:
      type: object
      description: Cabeçalho padrão de toda resposta da API (arquivo de mensagens do backend).
      properties:
        status:
          type: boolean
          description: true em caso de sucesso, false em caso de erro
        status_code:
          type: integer
          description: Mesmo valor do HTTP status code da resposta
        message:
          type: string
          description: Mensagem descritiva do resultado
      required:
      - status
      - status_code
    Usuario:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        nome:
          type: string
          maxLength: 100
        cpf:
          type: string
          maxLength: 18
        data_nascimento:
          type: string
          format: date
        id_imagem:
          type: integer
        id_genero:
          type: integer
        id_status_usuario:
          type: integer
        id_nivel_impacto:
          type: integer
      required:
      - id
      - nome
      - cpf
      - data_nascimento
      - id_imagem
      - id_genero
      - id_status_usuario
      - id_nivel_impacto
    Email:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        email:
          type: string
          maxLength: 255
        codigo_verificacao:
          type: string
          maxLength: 6
        id_usuario:
          type: integer
      required:
      - id
      - email
      - codigo_verificacao
      - id_usuario
    Telefone:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        numero:
          type: string
          maxLength: 20
        codigo_verificacao:
          type: string
          maxLength: 6
        id_usuario:
          type: integer
      required:
      - id
      - numero
      - codigo_verificacao
      - id_usuario
    Conta:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        id_email:
          type: integer
        senha:
          type: string
          maxLength: 255
          writeOnly: true
      required:
      - id
      - id_email
    Endereco:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        cep:
          type: string
          maxLength: 9
        rua:
          type: string
          maxLength: 100
        bairro:
          type: string
          maxLength: 100
