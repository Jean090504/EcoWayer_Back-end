# EcoWayer API — OpenAPI 3.0.3
# Gerado a partir de Modelo-Logico-Ecowayer.mwb (MySQL Workbench, versão atualizada em 01/10/2026) + messages.js (padrão de respostas)
# Importar direto no Swagger Editor / Swagger UI / Postman.

# ============================================================
# OPENAPI
# ============================================================
openapi: 3.0.3
info:
  title: EcoWayer API
  description: API do EcoWayer — marketplace gamificado de reciclagem. Documentação gerada a partir do
    modelo lógico MySQL Workbench (Modelo-Logico-Ecowayer.mwb, atualizado em 01/10/2026) e do módulo de
    mensagens padrão da API (messages.js), de autoria de Maxwillian Santana. Toda resposta segue o envelope
    { status, status_code, message, response }.
  version: 1.0.7.26
  contact:
    name: Maxwillian Santana
# ============================================================
# SERVIDORES
# ============================================================
servers:
- url: https://api.ecowayer.com.br/v1
  description: Produção (exemplo)
- url: http://localhost:3000/v1
  description: Desenvolvimento local
# ============================================================
# TAGS
# ============================================================
tags:
- name: Usuarios
  description: Cadastro de usuários, e-mails, telefones, endereços e contas
- name: Anuncios
  description: Anúncios de itens para venda, troca ou doação, condição do item e modalidades
- name: Categorias
  description: Categorias e tipos de categoria dos itens
- name: Pagamentos
  description: Pagamentos de anúncios em modalidade venda
- name: Entregas
  description: Entregas de anúncios, comprovantes e QR Codes
- name: Avaliacoes
  description: Avaliações do usuário sobre uma entrega
- name: Conversas
  description: Chat entre comprador e anunciante
- name: Denuncias
  description: Denúncias de anúncios/usuários
- name: Midia
  description: Upload e vínculo de imagens
- name: PontoColeta
  description: Pontos físicos de coleta, endereços e materiais aceitos
- name: Gamificacao
  description: Insígnias, pontos e níveis de impacto
- name: Vouchers
  description: Vouchers de parceiros resgatados com pontos e seus QR Codes
- name: IA
  description: Modelos de IA, datasets e treinamentos
- name: Moderacao
  description: Alertas automáticos gerados pela IA
- name: Administradores
  description: Contas administrativas
# ============================================================
# SEGURANÇA GLOBAL
# ============================================================
security:
- bearerAuth: []
# ============================================================
# PATHS
# ============================================================
paths:
  # --------------------------------------------------------
  # USUÁRIOS
  # --------------------------------------------------------
  /usuarios:
    post:
      tags:
      - Usuarios
      summary: Cadastrar novo usuário
      description: id_status_usuario e id_nivel_impacto são definidos pelo backend com valores padrão.
        id_imagem é setado depois, via endpoint de upload de foto. cpf aceita até 18 caracteres (com ou
        sem máscara).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
            example:
              nome: João Silva
              cpf: 123.456.789-01
              data_nascimento: '2005-10-15'
              id_genero: 1
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
                  properties:
                    status:
                      type: boolean
                      example: true
                    status_code:
                      type: integer
                      example: 201
                    message:
                      type: string
                      example: Registro inserido com um sucesso!
                    response:
                      $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType415'
        '500':
          $ref: '#/components/responses/InternalServerError500'
    get:
      tags:
      - Usuarios
      summary: Listar usuários
      parameters:
      - &id003
        name: page
        in: query
        schema:
          type: integer
          default: 1
      - &id004
        name: limit
        in: query
        schema:
          type: integer
          default: 20
      responses:
        '200':
          description: Lista de usuários
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
                  properties:
                    status:
                      type: boolean
                      example: true
                    status_code:
                      type: integer
                      example: 200
                    response:
                      type: array
                      items:
                        $ref: '#/components/schemas/Usuario'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
  /usuarios/{id}:
    get:
      tags:
      - Usuarios
      summary: Obter usuário por id
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador (PK)
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
                  properties:
                    status:
                      type: boolean
                      example: true
                    status_code:
                      type: integer
                      example: 200
                    response:
                      $ref: '#/components/schemas/Usuario'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
    put:
      tags:
      - Usuarios
      summary: Atualizar dados cadastrais do usuário (nome, cpf, data_nascimento, id_genero)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador (PK)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioInput'
            example:
              nome: João Silva
              cpf: 123.456.789-01
              data_nascimento: '2005-10-15'
              id_genero: 1
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
                  properties:
                    status:
                      type: boolean
                      example: true
                    status_code:
                      type: integer
                      example: 201
                    message:
                      type: string
                      example: Registro atualizado com um sucesso!
                    response:
                      $ref: '#/components/schemas/Usuario'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType415'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
    delete:
      tags:
      - Usuarios
      summary: Remover (ou inativar) usuário
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
        description: Identificador (PK)
      responses:
        '200':
          description: Removido
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
                  properties:
                    status:
                      type: boolean
                      example: true
                    status_code:
                      type: integer
                      example: 200
                    message:
                      type: string
                      example: Registro Deletado com um sucesso!
                    response:
                      type: object
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
  /usuarios/{idUsuario}/emails:
    post:
      tags:
      - Usuarios
      summary: Vincular e-mail ao usuário
      description: id_usuario vem da rota. codigo_verificacao (CHAR 6) é gerado pelo backend para o fluxo
        de verificação; o controle de tentativas/reenvio/bloqueio fica em tbl_verificacao (vinculada via
        tbl_email_verificacao).
      parameters:
      - name: idUsuario
        in: path
        required: true
        schema:
          type: integer
        description: ID do usuário dono do e-mail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailInput'
            example:
              email: joao@email.com
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
                  properties:
                    status:
                      type: boolean
                      example: true
                    status_code:
                      type: integer
                      example: 201
                    message:
                      type: string
                      example: Registro inserido com um sucesso!
                    response:
                      $ref: '#/components/schemas/Email'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType415'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
  /emails/{idEmail}/verificar:
    post:
      tags:
      - Usuarios
      summary: Confirmar código de verificação de e-mail
      description: Compara o código enviado com codigo_verificacao. O backend registra tentativas, reenvio
        e bloqueio temporário em tbl_verificacao (tbl_email_verificacao).
      parameters:
      - name: idEmail
        in: path
        required: true
        schema:
          type: integer
        description: ID do e-mail a verificar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificacaoCodigoInput'
            example:
              codigo: '482913'
      responses:
        '200':
          description: E-mail verificado com sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
                  properties:
                    status:
                      type: boolean
                      example: true
                    status_code:
                      type: integer
                      example: 200
                    message:
                      type: string
                      example: E-mail verificado com sucesso!
                    response:
                      type: object
        '400':
          $ref: '#/components/responses/BadRequest400'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType415'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
