  /usuarios/{idUsuario}/enderecos:
    post:
      tags:
      - Usuarios
      summary: Cadastrar endereço do usuário
      description: 'O endereço agora é independente do usuário: o backend grava o registro em tbl_endereco
        (preenchendo id_externa) e cria o vínculo em tbl_endereco_usuario (id_usuario vem da rota), preferencialmente
        na mesma transação.'
      parameters:
      - name: idUsuario
        in: path
        required: true
        schema:
          type: integer
        description: ID do usuário dono do endereço
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnderecoInput'
            example:
              cep: 01310-100
              rua: Av. Paulista, 1000
              bairro: Bela Vista
              cidade: São Paulo
              estado: São Paulo
              sigla: SP
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
                  properties:
                    status:
                      type: boolean
                      example: true
                    status_code:
                      type: integer
                      example: 201
                    message:
                      type: string
                      example: Registro inserido com um sucesso!
                    response:
                      $ref: '#/components/schemas/Endereco'
        '400':
          $ref: '#/components/responses/BadRequest400'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType415'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
    get:
      tags:
      - Usuarios
      summary: Listar endereços do usuário
      description: Busca via tbl_endereco_usuario (JOIN com tbl_endereco).
      parameters:
      - name: idUsuario
        in: path
        required: true
        schema:
          type: integer
        description: ID do usuário
      responses:
        '200':
          description: Lista
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
                  properties:
                    status:
                      type: boolean
                      example: true
                    status_code:
                      type: integer
                      example: 200
                    response:
                      type: array
                      items:
                        $ref: '#/components/schemas/Endereco'
        '404':
          $ref: '#/components/responses/NotFound404'
        '500':
          $ref: '#/components/responses/InternalServerError500'
  /contas:
    post:
      tags:
      - Usuarios
      summary: Criar conta/credencial vinculada a um e-mail já cadastrado
      description: senha é recebida em texto puro no request, mas deve ser convertida em hash pelo backend
        antes de gravar (VARCHAR 255). Nunca retornada no response (writeOnly).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContaInput'
            example:
              id_email: 1
              senha: SenhaForte123
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/RespostaBase'
                - type: object
